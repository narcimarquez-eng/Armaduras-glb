<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Hierba</title>
<style>
  html, body { margin: 0; height: 100%; background: #9fb8cf; overflow: hidden; font-family: system-ui, sans-serif; }
  #ui { position: fixed; top: 10px; left: 10px; background: rgba(15,20,30,.75); color: #e8eef5; padding: 10px 12px; border-radius: 10px; font-size: 12px; }
  #ui select, #ui input { margin-left: 6px; }
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}
</script>
</head>
<body>
<div id="ui">
  <b>Tarjetas de hierba</b><br>
  Calidad <select id="q"><option value="0.35">Baja</option><option value="1" selected>Media</option><option value="2.2">Alta</option></select><br>
  Viento <input id="wind" type="range" min="0" max="2" step="0.05" value="0.8"><br>
  <span id="stats"></span>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Hierba con TARJETAS: cada mata = 3 láminas cruzadas en estrella con una columna del atlas (fondo transparente).
   Todas las matas comparten geometría y material -> una sola llamada de dibujo (InstancedMesh).
   Recorte alfa (alphaTest), sin mezclas transparentes; el viento lo mueve el shader. */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb8cf);
scene.fog = new THREE.Fog(0x9fb8cf, 12, 34);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.4, 0); controls.maxPolarAngle = Math.PI * 0.49; controls.update();
scene.add(new THREE.HemisphereLight(0xdfefff, 0x4a5a2a, 1.4));
const sun = new THREE.DirectionalLight(0xfff3d8, 2.2); sun.position.set(4, 8, 3); scene.add(sun);

// Suelo con el verde de la hierba pintado (de lejos no hacen falta tarjetas)
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 64), new THREE.MeshStandardMaterial({ color: 0x3d5a22, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);

const atlas = new THREE.TextureLoader().load('textures/hierba_atlas.png');
atlas.colorSpace = THREE.SRGBColorSpace; atlas.anisotropy = 4;

// Geometría de una mata: 3 planos verticales de 0,6 m cruzados a 60°; uv.x se reasigna a la columna en el shader
function tuftGeometry() {
  const pos = [], uv = [], idx = [];
  for (let k = 0; k < 3; k++) {
    const a = k * Math.PI / 3, c = Math.cos(a) * 0.3, s = Math.sin(a) * 0.3, b = pos.length / 3;
    pos.push(-c, 0, -s, c, 0, s, c, 0.55, s, -c, 0.55, -s);   // matas de ~55 cm
    uv.push(0, 0, 1, 0, 1, 1, 0, 1);
    idx.push(b, b + 1, b + 2, b, b + 2, b + 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

const uniforms = { uTime: { value: 0 }, uWind: { value: 0.8 } };
const mat = new THREE.MeshStandardMaterial({ map: atlas, alphaTest: 0.45, side: THREE.DoubleSide, roughness: 0.9 });
mat.onBeforeCompile = (sh) => {
  sh.uniforms.uTime = uniforms.uTime; sh.uniforms.uWind = uniforms.uWind;
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nattribute float aCol;\nuniform float uTime, uWind;')
    .replace('#include <uv_vertex>', '#include <uv_vertex>\nvMapUv.x = (aCol + vMapUv.x) * 0.25;')
    .replace('#include <begin_vertex>', `#include <begin_vertex>
      vec4 wp = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
      float sway = sin(uTime * 1.7 + wp.x * 0.6 + wp.z * 0.4) + 0.4 * sin(uTime * 3.1 + wp.x * 1.3);
      transformed.x += sway * uWind * 0.30 * position.y * position.y;   // solo se mueve la punta
      transformed.z += sway * uWind * 0.12 * position.y * position.y;`);
  // normales hacia arriba: la hierba se ilumina como un césped, sin caras oscuras según el ángulo
  sh.vertexShader = sh.vertexShader.replace('#include <beginnormal_vertex>', 'vec3 objectNormal = vec3(0.0, 1.0, 0.0);');
};

let grass = null;
function build(quality) {
  if (grass) { scene.remove(grass); grass.dispose(); }
  const count = Math.round(9000 * quality), R = 7 + 5 * quality;   // más matas y más radio con más calidad
  const geo = tuftGeometry();
  const cols = new Float32Array(count);
  grass = new THREE.InstancedMesh(geo, mat, count);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3();
  for (let i = 0; i < count; i++) {
    const r = R * Math.sqrt(Math.random()), a = Math.random() * Math.PI * 2;
    p.set(Math.cos(a) * r, 0, Math.sin(a) * r);
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * Math.PI);
    const k = 0.7 + Math.random() * 0.7; s.set(k, k * (0.7 + Math.random() * 0.6), k);
    m.compose(p, q, s); grass.setMatrixAt(i, m);
    const z = Math.random();
    cols[i] = z < 0.50 ? 0 : z < 0.80 ? 1 : z < 0.95 ? 2 : 3;   // densa, alta, seca, con flores
  }
  geo.setAttribute('aCol', new THREE.InstancedBufferAttribute(cols, 1));
  grass.frustumCulled = false;
  scene.add(grass);
  document.getElementById('stats').textContent = `${count.toLocaleString()} matas · ${(count * 6).toLocaleString()} triángulos · 1 llamada de dibujo`;
}
build(1);
document.getElementById('q').onchange = (e) => build(parseFloat(e.target.value));
document.getElementById('wind').oninput = (e) => { uniforms.uWind.value = parseFloat(e.target.value); };

// Referencia de escala: una figura de 1,8 m
const fig = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 1.3, 6, 16), new THREE.MeshStandardMaterial({ color: 0x8a8f99, metalness: 0.6, roughness: 0.35 }));
fig.position.y = 0.87; scene.add(fig);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { uniforms.uTime.value = clock.getElapsedTime(); controls.update(); renderer.render(scene, camera); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
